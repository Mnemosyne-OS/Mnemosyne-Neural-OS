name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# None of these jobs writes to the repository: checkout, build, compare.
permissions:
  contents: read

jobs:
  docs-check:
    name: Docs integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check markdown files exist
        run: |
          echo "Checking core docs..."
          test -f README.md && echo "✔ README.md" || (echo "✖ README.md missing" && exit 1)
          test -f cli/docs/SUMMARY.md && echo "✔ cli/docs/SUMMARY.md" || echo "⚠ cli/docs/SUMMARY.md not found (optional)"
          echo "All checks passed."

  build:
    name: Build SDK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm run build:packages

  sync-check:
    name: Public ↔ npm sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check the public repo has not drifted from npm
        run: node tools/check-public-sync.mjs
