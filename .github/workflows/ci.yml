name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-check:
    name: Docs integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check markdown files exist
        run: |
          echo "Checking core docs..."
          test -f README.md && echo "✔ README.md" || (echo "✖ README.md missing" && exit 1)
          test -f cli/docs/SUMMARY.md && echo "✔ cli/docs/SUMMARY.md" || echo "⚠ cli/docs/SUMMARY.md not found (optional)"
          echo "All checks passed."

  build:
    name: Build SDK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm run build:packages
