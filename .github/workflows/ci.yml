name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# None of these jobs writes to the repository: checkout, build, compare.
permissions:
  contents: read

jobs:
  docs-check:
    name: Docs integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check markdown files exist
        run: |
          echo "Checking core docs..."
          test -f README.md && echo "✔ README.md" || (echo "✖ README.md missing" && exit 1)
          test -f cli/docs/SUMMARY.md && echo "✔ cli/docs/SUMMARY.md" || echo "⚠ cli/docs/SUMMARY.md not found (optional)"
          echo "All checks passed."

  build:
    name: Build SDK packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm run build:packages

  sync-check:
    name: Public ↔ npm sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the public repo has not drifted from npm
        run: node tools/check-public-sync.mjs
